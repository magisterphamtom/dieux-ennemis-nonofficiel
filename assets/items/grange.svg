<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Barn main body -->
  <rect x="10" y="45" width="80" height="48" rx="2" fill="#8b2a1a"/>
  <!-- Barn roof (gambrel) -->
  <polygon points="10,45 90,45 80,22 20,22" fill="#5a1a0a"/>
  <polygon points="20,22 80,22 65,8 35,8" fill="#6a2010"/>
  <!-- Roof trim -->
  <line x1="10" y1="45" x2="90" y2="45" stroke="#4a1005" stroke-width="2"/>
  <!-- Main door (large sliding) -->
  <rect x="30" y="55" width="40" height="38" rx="1" fill="#5a2a0a"/>
  <line x1="50" y1="55" x2="50" y2="93" stroke="#4a1a05" stroke-width="2"/>
  <!-- Door handles -->
  <circle cx="46" cy="74" r="2" fill="#c0a050"/>
  <circle cx="54" cy="74" r="2" fill="#c0a050"/>
  <!-- Hay visible inside -->
  <ellipse cx="38" cy="86" rx="6" ry="4" fill="#c8a840" opacity="0.7"/>
  <ellipse cx="62" cy="86" rx="6" ry="4" fill="#c8a840" opacity="0.7"/>
  <!-- Loft window -->
  <rect x="38" y="30" width="24" height="12" rx="2" fill="#3a1a00"/>
  <!-- Hay in loft window -->
  <ellipse cx="50" cy="36" rx="8" ry="5" fill="#c8a840" opacity="0.6"/>
  <!-- Side boards texture -->
  <line x1="10" y1="55" x2="30" y2="55" stroke="#7a2010" stroke-width="1"/>
  <line x1="70" y1="55" x2="90" y2="55" stroke="#7a2010" stroke-width="1"/>
  <line x1="10" y1="65" x2="30" y2="65" stroke="#7a2010" stroke-width="1"/>
  <line x1="70" y1="65" x2="90" y2="65" stroke="#7a2010" stroke-width="1"/>
  <line x1="10" y1="75" x2="30" y2="75" stroke="#7a2010" stroke-width="1"/>
  <line x1="70" y1="75" x2="90" y2="75" stroke="#7a2010" stroke-width="1"/>
</svg>