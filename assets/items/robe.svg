<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Robe main body (dark blue/purple, medieval) -->
  <path d="M30 30 Q28 50 22 92 L78 92 Q72 50 70 30 Z" fill="#3a3065"/>
  <!-- Robe flare at bottom -->
  <path d="M22 92 Q20 96 50 97 Q80 96 78 92 Z" fill="#2e2550"/>
  <!-- Left wide sleeve -->
  <path d="M30 30 Q14 36 8 58 Q12 60 16 56 Q20 46 32 44 Z" fill="#3a3065"/>
  <!-- Right wide sleeve -->
  <path d="M70 30 Q86 36 92 58 Q88 60 84 56 Q80 46 68 44 Z" fill="#3a3065"/>
  <!-- Sleeve cuff left -->
  <path d="M8 58 Q10 64 16 62 Q14 60 12 60 Z" fill="#c0a840"/>
  <!-- Sleeve cuff right -->
  <path d="M92 58 Q90 64 84 62 Q86 60 88 60 Z" fill="#c0a840"/>
  <!-- Center seam / fold -->
  <line x1="50" y1="30" x2="50" y2="92" stroke="#2e2550" stroke-width="1.5"/>
  <!-- Collar -->
  <path d="M35 30 Q50 22 65 30 Q60 36 50 32 Q40 36 35 30 Z" fill="#4a4080"/>
  <!-- Belt at waist -->
  <rect x="28" y="52" width="44" height="7" rx="3" fill="#c0a840"/>
  <!-- Belt buckle -->
  <rect x="44" y="51" width="12" height="9" rx="2" fill="#d4b840"/>
  <rect x="46" y="53" width="8" height="5" rx="1" fill="#3a3065"/>
  <!-- Decorative hem trim -->
  <path d="M22 80 Q50 84 78 80" stroke="#c0a840" stroke-width="2" fill="none"/>
  <!-- Fold lines for fabric texture -->
  <path d="M36 38 Q34 60 32 80" stroke="#2e2550" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M64 38 Q66 60 68 80" stroke="#2e2550" stroke-width="1" fill="none" opacity="0.7"/>
</svg>