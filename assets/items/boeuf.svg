<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Body - large stocky -->
  <ellipse cx="47" cy="62" rx="30" ry="20" fill="#7a5030"/>
  <!-- Neck -->
  <rect x="64" y="50" width="16" height="18" rx="6" fill="#7a5030"/>
  <!-- Head -->
  <ellipse cx="80" cy="46" rx="14" ry="12" fill="#7a5030"/>
  <!-- Snout -->
  <ellipse cx="90" cy="50" rx="8" ry="6" fill="#6a4025"/>
  <!-- Nostril -->
  <ellipse cx="88" cy="50" rx="2" ry="1.5" fill="#2a1010"/>
  <ellipse cx="94" cy="50" rx="2" ry="1.5" fill="#2a1010"/>
  <!-- Eye -->
  <circle cx="78" cy="42" r="3" fill="#1a0a05"/>
  <circle cx="79" cy="41" r="1" fill="white" opacity="0.6"/>
  <!-- Left horn -->
  <path d="M70 36 Q64 22 56 26" stroke="#c8b060" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Right horn -->
  <path d="M82 35 Q86 22 94 26" stroke="#c8b060" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="70" cy="40" rx="5" ry="8" fill="#6a4025" transform="rotate(-20 70 40)"/>
  <!-- Legs -->
  <rect x="26" y="78" width="10" height="14" rx="4" fill="#6a4025"/>
  <rect x="38" y="78" width="10" height="14" rx="4" fill="#6a4025"/>
  <rect x="52" y="78" width="10" height="14" rx="4" fill="#6a4025"/>
  <rect x="64" y="78" width="10" height="14" rx="4" fill="#6a4025"/>
  <!-- Dewlap -->
  <ellipse cx="72" cy="62" rx="6" ry="10" fill="#6a4025"/>
  <!-- Tail -->
  <path d="M17 60 Q8 52 12 44" stroke="#7a5030" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="12" cy="42" rx="3" ry="5" fill="#5a3820"/>
</svg>