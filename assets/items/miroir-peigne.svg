<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Mirror handle -->
  <rect x="26" y="62" width="7" height="22" rx="3" fill="#8a7a6a" stroke="#c0b080" stroke-width="1"/>
  <!-- Mirror oval frame -->
  <ellipse cx="29" cy="47" rx="17" ry="22" fill="#b8a878" stroke="#c0b080" stroke-width="2.5"/>
  <!-- Mirror reflective face -->
  <ellipse cx="29" cy="47" rx="13" ry="18" fill="#d8e8f0" stroke="#a09060" stroke-width="1"/>
  <!-- Mirror highlight -->
  <ellipse cx="24" cy="39" rx="4" ry="6" fill="white" opacity="0.35"/>
  <!-- Comb body -->
  <rect x="54" y="28" width="28" height="10" rx="3" fill="#c8a84a" stroke="#a07a20" stroke-width="1.5"/>
  <!-- Comb teeth -->
  <rect x="56" y="38" width="3" height="18" rx="1.5" fill="#c8a84a" stroke="#a07a20" stroke-width="1"/>
  <rect x="61" y="38" width="3" height="18" rx="1.5" fill="#c8a84a" stroke="#a07a20" stroke-width="1"/>
  <rect x="66" y="38" width="3" height="18" rx="1.5" fill="#c8a84a" stroke="#a07a20" stroke-width="1"/>
  <rect x="71" y="38" width="3" height="18" rx="1.5" fill="#c8a84a" stroke="#a07a20" stroke-width="1"/>
  <rect x="76" y="38" width="3" height="18" rx="1.5" fill="#c8a84a" stroke="#a07a20" stroke-width="1"/>
</svg>