<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Molten glow behind building -->
  <ellipse cx="50" cy="80" rx="40" ry="12" fill="#e06000" opacity="0.35"/>
  <!-- Main building -->
  <rect x="15" y="45" width="70" height="45" rx="2" fill="#5a4030"/>
  <!-- Brick texture lines -->
  <line x1="15" y1="55" x2="85" y2="55" stroke="#4a3025" stroke-width="1"/>
  <line x1="15" y1="65" x2="85" y2="65" stroke="#4a3025" stroke-width="1"/>
  <line x1="15" y1="75" x2="85" y2="75" stroke="#4a3025" stroke-width="1"/>
  <line x1="30" y1="45" x2="30" y2="90" stroke="#4a3025" stroke-width="0.8"/>
  <line x1="50" y1="45" x2="50" y2="90" stroke="#4a3025" stroke-width="0.8"/>
  <line x1="70" y1="45" x2="70" y2="90" stroke="#4a3025" stroke-width="0.8"/>
  <!-- Roof -->
  <polygon points="12,45 88,45 80,32 20,32" fill="#3a2518"/>
  <!-- Left smokestack -->
  <rect x="22" y="10" width="10" height="28" rx="2" fill="#4a3520"/>
  <!-- Right smokestack -->
  <rect x="62" y="16" width="10" height="22" rx="2" fill="#4a3520"/>
  <!-- Smoke from left -->
  <ellipse cx="27" cy="8" rx="6" ry="4" fill="#888070" opacity="0.7"/>
  <ellipse cx="25" cy="4" rx="4" ry="3" fill="#888070" opacity="0.5"/>
  <!-- Smoke from right -->
  <ellipse cx="67" cy="14" rx="5" ry="3.5" fill="#888070" opacity="0.7"/>
  <!-- Molten window glow -->
  <rect x="25" y="55" width="18" height="16" rx="2" fill="#ff8800" opacity="0.9"/>
  <rect x="27" y="57" width="14" height="12" rx="1" fill="#ffcc00" opacity="0.6"/>
  <!-- Door -->
  <rect x="42" y="68" width="16" height="22" rx="2" fill="#2a1a0a"/>
</svg>