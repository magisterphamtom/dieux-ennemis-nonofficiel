<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Body - stocky and round -->
  <ellipse cx="48" cy="60" rx="28" ry="19" fill="#8b6a40"/>
  <!-- Neck -->
  <rect x="64" y="46" width="14" height="20" rx="6" fill="#8b6a40"/>
  <!-- Head -->
  <ellipse cx="79" cy="42" rx="13" ry="11" fill="#8b6a40"/>
  <!-- Snout -->
  <ellipse cx="88" cy="47" rx="7" ry="5" fill="#7a5a30"/>
  <!-- Nostril -->
  <ellipse cx="87" cy="47" rx="1.5" ry="1" fill="#2a1808"/>
  <ellipse cx="92" cy="47" rx="1.5" ry="1" fill="#2a1808"/>
  <!-- Eye -->
  <circle cx="77" cy="38" r="3" fill="#1a0a05"/>
  <circle cx="78" cy="37" r="1" fill="white" opacity="0.6"/>
  <!-- Ear -->
  <ellipse cx="70" cy="33" rx="4" ry="7" fill="#7a5a30" transform="rotate(-10 70 33)"/>
  <!-- Shaggy mane -->
  <path d="M68 35 Q65 30 66 38 Q63 28 64 38 Q60 26 62 38 Q58 28 60 38" stroke="#5a3a18" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M72 36 Q70 28 71 37" stroke="#5a3a18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Forelock -->
  <path d="M76 33 Q74 24 76 30 Q73 22 75 30" stroke="#5a3a18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Stocky legs (shorter) -->
  <rect x="30" y="76" width="9" height="14" rx="4" fill="#7a5a30"/>
  <rect x="41" y="76" width="9" height="14" rx="4" fill="#7a5a30"/>
  <rect x="54" y="76" width="9" height="14" rx="4" fill="#7a5a30"/>
  <rect x="65" y="76" width="9" height="14" rx="4" fill="#7a5a30"/>
  <!-- Hooves -->
  <rect x="30" y="87" width="9" height="5" rx="2" fill="#3a2810"/>
  <rect x="41" y="87" width="9" height="5" rx="2" fill="#3a2810"/>
  <rect x="54" y="87" width="9" height="5" rx="2" fill="#3a2810"/>
  <rect x="65" y="87" width="9" height="5" rx="2" fill="#3a2810"/>
  <!-- Tail -->
  <path d="M20 58 Q10 48 14 38 Q16 30 18 38" stroke="#5a3a18" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>