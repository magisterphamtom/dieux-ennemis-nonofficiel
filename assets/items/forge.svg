<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#2a1f14"/>
  <!-- Forge fire glow behind -->
  <ellipse cx="30" cy="72" rx="22" ry="16" fill="#e06000" opacity="0.6"/>
  <ellipse cx="30" cy="65" rx="14" ry="10" fill="#ffaa00" opacity="0.5"/>
  <!-- Coals base -->
  <ellipse cx="30" cy="78" rx="20" ry="8" fill="#4a2008"/>
  <!-- Fire flames -->
  <path d="M18 75 Q22 55 28 60 Q30 48 34 62 Q38 52 40 72" fill="#ff6600" opacity="0.9"/>
  <path d="M22 75 Q26 60 30 65 Q32 55 36 70" fill="#ffaa00" opacity="0.8"/>
  <!-- Forge body -->
  <rect x="10" y="70" width="40" height="12" rx="4" fill="#3a2515"/>
  <!-- Anvil base -->
  <rect x="48" y="78" width="38" height="10" rx="3" fill="#555050"/>
  <!-- Anvil body -->
  <rect x="52" y="62" width="30" height="18" rx="2" fill="#5a5560"/>
  <!-- Anvil horn (left) -->
  <polygon points="52,68 40,72 52,76" fill="#5a5560"/>
  <!-- Anvil top face -->
  <rect x="50" y="58" width="34" height="8" rx="2" fill="#707080"/>
  <!-- Hammer handle -->
  <line x1="72" y1="20" x2="62" y2="55" stroke="#8b6a3a" stroke-width="5" stroke-linecap="round"/>
  <!-- Hammer head -->
  <rect x="60" y="10" width="22" height="12" rx="3" fill="#808090" transform="rotate(-30 71 16)"/>
</svg>